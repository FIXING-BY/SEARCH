<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Qono Zen | Breath Guide</title>
    <style>
        :root { --bg: #050505; --glass: rgba(255, 255, 255, 0.02); --border: rgba(255, 255, 255, 0.08); --accent: #00ff88; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background: var(--bg); height: 100vh; display: flex; justify-content: center; align-items: center; color: white; overflow: hidden; }

        .app {
            background: var(--glass); backdrop-filter: blur(60px); border: 1px solid var(--border);
            border-radius: 40px; width: 400px; height: 500px; display: flex; flex-direction: column;
            align-items: center; justify-content: space-around; padding: 40px;
            box-shadow: 0 50px 100px rgba(0,0,0,1);
        }

        .info { text-align: center; }
        .info h1 { font-size: 1.2rem; font-weight: 900; letter-spacing: 3px; color: #fff; }
        .info p { font-size: 0.6rem; color: #444; margin-top: 5px; text-transform: uppercase; }

        /* NEFES DAİRESİ */
        .circle-container {
            position: relative; width: 200px; height: 200px;
            display: flex; justify-content: center; align-items: center;
        }

        .breath-circle {
            width: 100px; height: 100px;
            background: radial-gradient(circle, var(--accent) 0%, transparent 70%);
            border-radius: 50%;
            box-shadow: 0 0 50px var(--accent);
            opacity: 0.6;
            transition: 4s ease-in-out; /* 4 saniyelik geçişler */
        }

        .status-text {
            position: absolute; font-weight: 900; font-size: 1rem;
            text-transform: uppercase; letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(0,0,0,0.5);
        }

        .timer { font-family: monospace; font-size: 1.5rem; color: #444; }

        .btn {
            background: #fff; color: #000; padding: 15px 40px; border-radius: 20px;
            font-weight: 800; cursor: pointer; border: none; text-transform: uppercase;
            transition: 0.3s;
        }
        .btn:hover { transform: scale(1.05); background: var(--accent); }
    </style>
</head>
<body>

    <div class="app">
        <div class="info">
            <h1>QONO ZEN</h1>
            <p>1 Dakikalık Zihin Temizliği</p>
        </div>

        <div class="circle-container">
            <div id="circle" class="breath-circle"></div>
            <div id="status" class="status-text">HAZIR?</div>
        </div>

        <div id="timerDisplay" class="timer">01:00</div>

        <button id="startBtn" class="btn" onclick="startSession()">BAŞLAT</button>
    </div>

    <script>
        let timeLeft = 60;
        let isRunning = false;
        const circle = document.getElementById('circle');
        const status = document.getElementById('status');
        const timerDisplay = document.getElementById('timerDisplay');
        const startBtn = document.getElementById('startBtn');

        function startSession() {
            if (isRunning) return;
            isRunning = true;
            timeLeft = 60;
            startBtn.style.display = 'none';
            
            const sessionInterval = setInterval(() => {
                timeLeft--;
                let mins = Math.floor(timeLeft / 60);
                let secs = timeLeft % 60;
                timerDisplay.innerText = `${mins < 10 ? '0' : ''}${mins}:${secs < 10 ? '0' : ''}${secs}`;

                if (timeLeft <= 0) {
                    clearInterval(sessionInterval);
                    finishSession();
                }
            }, 1000);

            breathLoop();
        }

        async function breathLoop() {
            if (timeLeft <= 0) return;

            // 1. NEFES AL (4sn)
            status.innerText = "NEFES AL";
            circle.style.transform = "scale(2.5)";
            circle.style.opacity = "1";
            await sleep(4000);

            // 2. TUT (4sn)
            status.innerText = "TUT";
            await sleep(4000);

            // 3. NEFES VER (4sn)
            status.innerText = "NEFES VER";
            circle.style.transform = "scale(1)";
            circle.style.opacity = "0.4";
            await sleep(4000);

            // 4. TUT (4sn)
            status.innerText = "TUT";
            await sleep(4000);

            if (timeLeft > 0) breathLoop();
        }

        function sleep(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }

        function finishSession() {
            isRunning = false;
            status.innerText = "TAMAMLANDI";
            circle.style.transform = "scale(1.2)";
            circle.style.boxShadow = "0 0 100px #fff";
            startBtn.style.display = 'block';
            startBtn.innerText = "TEKRARLA";
        }
    </script>
</body>
</html>
