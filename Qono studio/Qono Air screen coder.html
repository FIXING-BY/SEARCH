<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Qono Air Screen | Fix Edition</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root { --bg: #050505; --glass: rgba(255, 255, 255, 0.02); --border: rgba(255, 255, 255, 0.08); --accent: #00ff88; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background: var(--bg); height: 100vh; color: white; overflow: hidden; display: flex; flex-direction: column; }

        /* MASTER UI */
        .top-bar { height: 60px; border-bottom: 1px solid var(--border); display: flex; align-items: center; padding: 0 25px; justify-content: space-between; background: rgba(0,0,0,0.3); }
        .logo { font-weight: 900; letter-spacing: 2px; color: var(--accent); font-size: 0.9rem; }
        .container { display: flex; flex: 1; height: calc(100vh - 60px); }
        .sidebar { width: 280px; border-right: 1px solid var(--border); padding: 20px; background: rgba(0,0,0,0.1); }
        .btn { width: 100%; padding: 12px; margin-bottom: 10px; border-radius: 12px; border: 1px solid var(--border); background: var(--glass); color: #fff; cursor: pointer; font-size: 0.75rem; font-weight: 700; transition: 0.2s; }
        .btn:hover { border-color: var(--accent); color: var(--accent); }
        .active-mode { background: var(--accent); color: #000; border-color: var(--accent); }
        .workspace { flex: 1; display: flex; flex-direction: column; padding: 15px; }
        textarea { flex: 1; background: #080808; border: 1px solid var(--border); border-radius: 20px; padding: 25px; color: #00ff88; font-family: 'Fira Code', monospace; font-size: 1rem; outline: none; resize: none; }

        /* VIEWER UI */
        #previewView { position: fixed; inset: 0; z-index: 999; background: #000; display: none; }
        .wait-screen { height: 100vh; width: 100vw; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #050505; }
        .wait-screen h2 { font-size: 0.8rem; color: #444; letter-spacing: 5px; margin-bottom: 20px; }
        .viewer-id-badge { font-size: 3rem; font-weight: 900; color: var(--accent); text-shadow: 0 0 30px rgba(0,255,136,0.3); font-family: monospace; }
        .python-term { background: #000; color: #00ff88; padding: 30px; height: 100vh; font-family: 'Fira Code', monospace; font-size: 1.2rem; white-space: pre-wrap; }
        
        .overlay { position: fixed; inset: 0; background: #050505; display: flex; align-items: center; justify-content: center; z-index: 1000; }
        .modal { background: #0d0d0d; padding: 50px; border-radius: 40px; border: 1px solid var(--border); text-align: center; width: 400px; }
    </style>
</head>
<body>

    <div id="setup" class="overlay">
        <div class="modal">
            <h2 style="margin-bottom: 10px; letter-spacing: 3px;">QONO AIR</h2>
            <button class="btn" style="padding: 20px; margin-bottom: 15px;" onclick="init('editor')">KOD YAZICI (MASTER)</button>
            <button class="btn" style="padding: 20px;" onclick="init('viewer')">TAM EKRAN İZLEYİCİ (AIR)</button>
        </div>
    </div>

    <div id="masterUI" style="display:none; flex-direction: column; height: 100vh;">
        <div class="top-bar">
            <div class="logo">QONO AIR STUDIO</div>
            <div id="connectionStatus" style="font-size: 0.6rem; color: #444;">DURUM: BEKLİYOR</div>
        </div>
        <div class="container">
            <div class="sidebar">
                <button id="htmlBtn" class="btn active-mode" onclick="setMode('html')">HTML STUDIO</button>
                <button id="pyBtn" class="btn" onclick="setMode('python')">PYTHON TERM</button>
                <button class="btn" onclick="connectToPeer()" style="border-style: dashed; margin-top: 20px;">+ EKRANA BAĞLAN</button>
            </div>
            <div class="workspace">
                <textarea id="codeIn" placeholder="Kodlamaya başla..." oninput="sync()"></textarea>
            </div>
        </div>
    </div>

    <div id="previewView">
        <div id="screenContent" class="wait-screen">
            <h2>SİNYAL BEKLENİYOR</h2>
            <div id="viewerIdDisplay" class="viewer-id-badge">...</div>
        </div>
    </div>

    <script>
        let peer, conn, role, currentMode = 'html';
        const MY_ID = "AIR-" + Math.floor(1000 + Math.random() * 9000);

        function init(type) {
            role = type;
            document.getElementById('setup').style.display = 'none';
            peer = new Peer(MY_ID);

            peer.on('open', id => {
                if(role === 'editor') {
                    document.getElementById('masterUI').style.display = 'flex';
                } else {
                    document.getElementById('previewView').style.display = 'block';
                    document.getElementById('viewerIdDisplay').innerText = id;
                }
            });

            // Karşı taraf bize bağlandığında
            peer.on('connection', c => {
                conn = c;
                setupConn();
            });
        }

        function connectToPeer() {
            const remoteId = prompt("İzleyici Ekran ID'sini gir:");
            if(!remoteId) return;
            conn = peer.connect(remoteId);
            
            // Bağlantı tam kurulduğunda ilk sinyali gönder
            conn.on('open', () => {
                setupConn();
                sync(); // İlk boş ekranı veya kodu hemen gönder
            });
        }

        function setupConn() {
            if(role === 'editor') {
                document.getElementById('connectionStatus').innerText = "DURUM: EKRAN EŞLEŞTİ";
                document.getElementById('connectionStatus').style.color = "#00ff88";
            }

            // Veri geldiğinde çalışacak kısım (Özellikle Viewer için)
            conn.on('data', data => {
                console.log("Veri geldi:", data);
                if(role === 'viewer') renderRemote(data);
            });

            // Bağlantı koparsa uyar
            conn.on('close', () => {
                if(role === 'editor') document.getElementById('connectionStatus').innerText = "DURUM: KOPTU";
            });
        }

        function setMode(mode) {
            currentMode = mode;
            document.getElementById('htmlBtn').classList.toggle('active-mode', mode === 'html');
            document.getElementById('pyBtn').classList.toggle('active-mode', mode === 'python');
            sync();
        }

        function sync() {
            if(!conn || !conn.open || role !== 'editor') return;
            const code = document.getElementById('codeIn').value;
            conn.send({ mode: currentMode, content: code });
        }

        function renderRemote(data) {
            const screen = document.getElementById('screenContent');
            if(data.mode === 'html') {
                screen.style.background = "#fff";
                screen.innerHTML = `<iframe style="width:100vw; height:100vh; border:none;"></iframe>`;
                const doc = screen.querySelector('iframe').contentWindow.document;
                doc.open();
                doc.write(data.content || " "); // Boşsa bile render al
                doc.close();
            } else {
                screen.style.background = "#000";
                screen.innerHTML = `<div class="python-term"># Qono Python Output\n\n${data.content}</div>`;
            }
        }
    </script>
</body>
</html>
