<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Qono Translate | Neural Engine</title>
    <style>
        :root {
            --bg: #000;
            --glass: rgba(255, 255, 255, 0.02);
            --border: rgba(255, 255, 255, 0.08);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }

        body {
            background: var(--bg);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            overflow: hidden;
        }

        .translate-card {
            background: var(--glass);
            backdrop-filter: blur(50px);
            border: 1px solid var(--border);
            padding: 50px;
            border-radius: 60px;
            width: 850px;
            box-shadow: 0 40px 120px rgba(0,0,0,0.9);
            z-index: 10;
        }

        .brand {
            font-size: 0.7rem;
            letter-spacing: 16px;
            color: #222;
            margin-bottom: 40px;
            text-transform: uppercase;
            text-align: center;
        }
        .brand b { color: #555; font-weight: 800; }

        .translator-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
        }

        .lang-panel { display: flex; flex-direction: column; gap: 15px; }

        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 10px;
        }

        .label { font-size: 0.6rem; letter-spacing: 4px; color: #444; font-weight: 800; text-transform: uppercase; }

        select {
            background: transparent;
            border: none;
            color: #fff;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            outline: none;
        }

        textarea {
            width: 100%;
            height: 220px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border);
            border-radius: 25px;
            padding: 25px;
            color: #fff;
            font-size: 1.1rem;
            resize: none;
            line-height: 1.6;
            transition: all 0.3s ease;
        }

        textarea:focus { background: rgba(255, 255, 255, 0.05); border-color: #fff; outline: none; }

        .output-box { background: rgba(255, 255, 255, 0.01); color: #888; cursor: default; }

        .action-bar {
            margin-top: 35px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .status { font-size: 0.6rem; color: #222; letter-spacing: 2px; font-weight: 800; }

        .btn-translate {
            padding: 18px 45px;
            border-radius: 22px;
            border: none;
            background: #fff;
            color: #000;
            font-weight: 900;
            letter-spacing: 3px;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-translate:active { transform: scale(0.95); }
        .btn-translate:disabled { opacity: 0.3; }

    </style>
</head>
<body>

    <div class="translate-card" id="card">
        <div class="brand">QONO <b>NEURAL</b></div>
        
        <div class="translator-grid">
            <div class="lang-panel">
                <div class="panel-header">
                    <span class="label">Input</span>
                    <span id="detectedLang" style="font-size: 0.5rem; color: #555;">AUTO-DETECT</span>
                </div>
                <textarea id="inputText" placeholder="Enter text..."></textarea>
            </div>

            <div class="lang-panel">
                <div class="panel-header">
                    <span class="label">Target</span>
                    <select id="targetLang">
                        <option value="tr">Turkish</option>
                        <option value="en" selected>English</option>
                        <option value="de">German</option>
                        <option value="fr">French</option>
                        <option value="es">Spanish</option>
                        <option value="it">Italian</option>
                        <option value="ru">Russian</option>
                        <option value="ja">Japanese</option>
                        <option value="ko">Korean</option>
                    </select>
                </div>
                <textarea id="outputText" class="output-box" readonly placeholder="Result..."></textarea>
            </div>
        </div>

        <div class="action-bar">
            <div class="status" id="status">NEURAL LINK ACTIVE</div>
            <button class="btn-translate" id="transBtn">EXECUTE</button>
        </div>
    </div>

    <script>
        const inputText = document.getElementById('inputText');
        const outputText = document.getElementById('outputText');
        const transBtn = document.getElementById('transBtn');
        const targetLang = document.getElementById('targetLang');
        const status = document.getElementById('status');
        const detectedLabel = document.getElementById('detectedLang');

        transBtn.onclick = async () => {
            const text = inputText.value.trim();
            if(!text) return;

            transBtn.disabled = true;
            transBtn.textContent = "WAIT...";
            status.textContent = "NEURAL ANALYSIS IN PROGRESS...";

            const target = targetLang.value;
            // Google'ın gizli translate API'sini kullanıyoruz (Auto-detect destekler)
            const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=${target}&dt=t&q=${encodeURIComponent(text)}`;

            try {
                const response = await fetch(url);
                const data = await response.json();
                
                // data[0] içinde çeviri, data[2] içinde algılanan dil kodu döner
                if(data && data[0]) {
                    let fullTranslation = "";
                    data[0].forEach(part => { if(part[0]) fullTranslation += part[0]; });
                    
                    outputText.value = fullTranslation;
                    detectedLabel.textContent = "DETECTED: " + data[2].toUpperCase();
                    status.textContent = "TRANSLATION SUCCESSFUL";
                }
            } catch (error) {
                status.textContent = "CONNECTION ERROR";
                console.log(error);
            }

            transBtn.disabled = false;
            transBtn.textContent = "EXECUTE";

            // Bump effect
            document.getElementById('card').animate([
                { transform: 'scale(1)' }, { transform: 'scale(1.01)' }, { transform: 'scale(1)' }
            ], { duration: 200 });
        };
    </script>
</body>
</html>
